# 1. امسح الملف
rm -f ~/Desktop/test/testb/smart1/pubspec.yaml

# 2. اعمل واحد جديد
cat > ~/Desktop/test/testb/smart1/pubspec.yaml << 'EOF'
name: smart1
description: "Smart Home ESP32 Controller"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.3
  multicast_dns: ^0.3.2+6
  file_picker: ^8.1.2
  http: ^1.2.2
  cupertino_icons: ^1.0.8
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
EOF

# 3. تحقق
cat ~/Desktop/test/testb/smart1/pubspec.yaml

# 4. نزّل المكتبات
cd ~/Desktop/test/testb/smart1
flutter clean
flutter pub get

# 5. ابني
flutter build apk --release
