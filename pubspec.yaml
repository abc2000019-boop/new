name: smart1
description: Smart Home Control App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebSocket
  web_socket_channel: ^3.0.1

  # State Management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.3.2

  # QR Code
  qr_flutter: ^4.1.0

  # HTTP (OTA)
  http: ^1.2.2
  file_picker: ^8.1.2

  # UI
  cupertino_icons: ^1.0.8

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  logger: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/